name: daily-pipeline
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [claude/startup-job-matcher-arch-4brgab]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data
          key: db-${{ github.run_id }}
          restore-keys: db-
      - run: python -m recruited run
        env:
          RECRUITED_CONTACT: ${{ secrets.RECRUITED_CONTACT }}
      - run: python -m recruited stats
      - name: Sample match (smoke test on live data)
        run: python -m recruited match examples/sample_resume.txt --limit 10
      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: recruited-db
          path: data/recruited.db
          retention-days: 7
